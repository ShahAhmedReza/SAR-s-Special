name: Update README Directory Tree

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - 'README.md'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  update-tree:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate Directory Tree and Update README
        run: |
          python3 -c "
          import os

          EXCLUDE_DIRS = {'.git', '.github', '.vscode', 'node_modules', '__pycache__'}
          EXCLUDE_FILES = {'.gitignore', 'README.md', 'LICENSE', '.DS_Store'}

          def generate_tree(dir_path, prefix=''):
              try:
                  entries = os.listdir(dir_path)
              except PermissionError:
                  return ''

              entries = [e for e in entries if e not in EXCLUDE_DIRS and e not in EXCLUDE_FILES]
              entries.sort(key=lambda s: (not os.path.isdir(os.path.join(dir_path, s)), s.lower()))

              tree_str = ''
              for i, entry in enumerate(entries):
                  path = os.path.join(dir_path, entry)
                  is_last = (i == len(entries) - 1)
                  connector = '└── ' if is_last else '├── '
                  tree_str += f'{prefix}{connector}{entry}\n'

                  if os.path.isdir(path):
                      extension = '    ' if is_last else '│   '
                      tree_str += generate_tree(path, prefix + extension)
              return tree_str

          tree_content = '```text\n.\n' + generate_tree('.') + '```'

          readme_path = 'README.md'
          if not os.path.exists(readme_path):
              print('README.md not found!')
              exit(1)

          with open(readme_path, 'r', encoding='utf-8') as f:
              content = f.read()

          start_marker = '<!-- START_TREE -->'
          end_marker = '<!-- END_TREE -->'

          if start_marker in content and end_marker in content:
              before = content.split(start_marker)[0]
              after = content.split(end_marker)[1]
              new_content = f'{before}{start_marker}\n{tree_content}\n{end_marker}{after}'

              with open(readme_path, 'w', encoding='utf-8') as f:
                  f.write(new_content)
              print('Successfully updated README.md directory tree.')
          else:
              print('Markers <!-- START_TREE --> and <!-- END_TREE --> not found in README.md.')
          "

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(docs): auto-update directory tree in README.md [skip ci]"
          branch: ${{ github.head_ref || github.ref_name }}
          file_pattern: 'README.md'
